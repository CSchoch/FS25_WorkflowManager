<text xml:space="preserve" x="451" y="272.5" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">70</text>
<text xml:space="preserve" x="541" y="272.1" font-size="16" fill="#ffffff" text-anchor="start">%</text>
<text xml:space="preserve" x="46" y="321.4" font-size="14" fill="#999999" font-style="italic" text-anchor="start">Leave a field empty to keep AutoDrive's own setting.</text>
