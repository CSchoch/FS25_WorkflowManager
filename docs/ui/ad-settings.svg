<svg xmlns="http://www.w3.org/2000/svg" width="684" height="492" viewBox="0 0 684 492" font-family="'Nunito Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>AD/CP settings</title>
<defs><linearGradient id="separator" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="0" width="684" height="492" rx="10" fill="#0b0b0b"/>
<rect x="12" y="4" width="660" height="420" rx="8" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
<text xml:space="preserve" x="346" y="46.4" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">AD / CP SETTINGS</text>
<rect x="76.5" y="74" width="539" height="2" fill="url(#separator)"/>
<text xml:space="preserve" x="46" y="115.3" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">AutoDrive Settings</text>
<text xml:space="preserve" x="121" y="162.1" font-size="16" fill="#ffffff" text-anchor="start">Unload Fill Level</text>
<rect x="371" y="136.5" width="160" height="40" rx="4" fill="#2c2c2c"/>
<text xml:space="preserve" x="451" y="162.5" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">90</text>
<text xml:space="preserve" x="541" y="162.1" font-size="16" fill="#ffffff" text-anchor="start">%</text>
<text xml:space="preserve" x="121" y="217.1" font-size="16" fill="#ffffff" text-anchor="start">Pipe Offset</text>
<rect x="371" y="191.5" width="160" height="40" rx="4" fill="#2c2c2c"/>
<text xml:space="preserve" x="451" y="217.5" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1.5</text>
<text xml:space="preserve" x="541" y="217.1" font-size="16" fill="#ffffff" text-anchor="start">m</text>
